name: Build Aetheria APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Setup FLAC
        run: bash decent/decent-media3-decoder-flac/setup.sh

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/aetheria-release.jks

      - name: Bump versionCode
        run: |
          sed -i "s/^versionCode=.*/versionCode=$((30200 + GITHUB_RUN_NUMBER))/" version.properties
          cat version.properties

      - name: Build Release APK
        env:
          AURORA_KEYSTORE_FILE: keystore/aetheria-release.jks
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AURORA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Aetheria.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-APK
          path: app/build/outputs/apk/release/Aetheria.apk
          if-no-files-found: error
