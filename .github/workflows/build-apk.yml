name: Build Aetheria APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Setup FLAC
        run: bash decent/decent-media3-decoder-flac/setup.sh

      - name: Build Debug APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Aetheria.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-APK
          path: app/build/outputs/apk/release/Aetheria.apk
          if-no-files-found: error
